name: abeja_app
description: "App de monitoreo agrícola con drones"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # 📦 MAPAS
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.0   # se sigue usando internamente para guardar coordenadas

  # 🎨 UI Y ESTADO
  provider: ^6.0.0

  # 📡 CONEXIÓN AL BACKEND (AgroSwarm Shield - FastAPI)
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # 🐝 ANIMACIONES (para la abeja)
  lottie: ^2.7.0   # ← SOLO UNA VEZ

  # 📱 UTILIDADES
  shared_preferences: ^2.0.0
  geolocator: ^10.0.0

  # 🎨 ICONOS
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/